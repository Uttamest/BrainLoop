name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controllers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: find app tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l && php -l index.php
      - name: Check controller integration
        run: php tests/controllers.php
      - name: Check review scheduling
        run: php tests/scheduler.php
