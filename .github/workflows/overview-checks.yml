name: Overview checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          coverage: none
          tools: none
      - name: Check overview and test dependency syntax
        run: |
          for file in app/controllers/PageController.php app/core/helpers.php app/core/urls.php app/views/partials/icons.php app/views/pages/dashboard.php app/views/pages/analytics.php app/views/layouts/main.php tests/page-controller.php; do
            php -l "$file" || exit 1
          done
      - name: Check overview ownership and rendered views
        run: php -d output_buffering=0 tests/page-controller.php
